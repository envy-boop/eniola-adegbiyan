<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eniola Olamide Adegbiyan</title>
  <meta name="description" content="Operations, workflow automation and project coordination portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Tab icon: a gold "E" -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0f'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-size='40' fill='%23e8b86a'%3EE%3C/text%3E%3C/svg%3E" />
  <!-- The preview card people see when you share your link on LinkedIn or WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Eniola Adegbiyan | Operations & Workflow Automation" />
  <meta property="og:description" content="I build the systems, workflows, and practical tools that help teams work better." />
  <meta property="og:image" content="https://envy-boop.github.io/photo.jpg" />
  <meta property="og:url" content="https://envy-boop.github.io/" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Lets the page know JavaScript is on, so the fade-in only hides things when it can show them again -->
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <header class="site-header">
    <a href="#top" id="brand" class="brand"></a>
    <nav>
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <a href="#experience">Experience</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-text">
        <p class="status"><span class="dot"></span><span id="status"></span></p>
        <h1 id="headline"></h1>
        <p class="subline" id="subline"></p>
        <div class="cta">
          <a class="btn primary" href="#work">See my work</a>
          <a class="btn" href="#contact">Get in touch</a>
          <a class="btn" id="cv" href="cv.pdf" download>Download CV</a>
        </div>
        <div class="facts" id="facts"></div>
      </div>
      <div class="portrait" id="portrait" aria-hidden="false"></div>
    </section>

    <div class="ribbon" id="ribbon"><div class="ribbon-track" id="ribbon-track"></div></div>

    <section id="about">
      <h2>About</h2>
      <div class="about-grid">
        <div id="about-text" class="prose"></div>
        <div id="skills-grid" class="skills"></div>
      </div>
    </section>

    <section id="work">
      <h2>Selected work</h2>
      <p class="note" id="tools-note"></p>
      <div id="project-list"></div>
    </section>

    <section id="process">
      <h2>How I work</h2>
      <div class="steps" id="process-list"></div>
    </section>

    <section id="experience">
      <h2>Experience</h2>
      <div id="job-list"></div>
      <p class="education" id="earlier"></p>
      <p class="education" id="education"></p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p class="contact-lead">Hiring, or have an operations problem to untangle? Let's talk.</p>
      <div class="contact-actions">
        <a id="email" class="email"></a>
        <a id="whatsapp" class="btn whatsapp" target="_blank" rel="noopener">Chat on WhatsApp</a>
      </div>
      <div id="socials" class="socials"></div>
    </section>
  </main>

  <footer>
    <span>&copy; <span id="year"></span> <span id="footer-name"></span></span>
  </footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
  <script src="background.js"></script>
</body>
</html>
