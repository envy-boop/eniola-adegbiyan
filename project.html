  <!-- If something fails to load, show a clear message instead of a blank page -->
  <script>
    (function () {
      function warn(msg) {
        var box = document.createElement("div");
        box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;padding:16px 18px;border-radius:14px;background:#3a1212;color:#ffd7d7;font:15px/1.5 system-ui,sans-serif;border:1px solid #a33";
        box.textContent = "Site problem: " + msg;
        document.body.appendChild(box);
      }
      window.addEventListener("error", function (e) {
        if (e.target && e.target.tagName === "SCRIPT") warn("could not load " + e.target.getAttribute("src").split("?")[0] + ". Make sure it is in the same folder as this page.");
        else if (e.message) warn(e.message + (e.filename ? " (in " + e.filename.split("/").pop().split("?")[0] + ")" : ""));
      }, true);
      window.addEventListener("load", function () {
        if (typeof SITE === "undefined") warn("content.js did not load. Unzip the whole folder first, then open index.html from inside it.");
        else if (!document.querySelector(".site-header")) warn("main.js did not run. Make sure the newest main.js is in the same folder as this page.");
      });
    })();
  </script>
